# Tela de bloqueio — minimalista (paleta Tokyo Night)

$font      = JetBrainsMono Nerd Font
$font_thin = JetBrainsMono NF Thin
$wallpaper = ~/dotfiles/wallpapers/a_city_at_night_with_a_fence_and_buildings.jpg

$text      = rgb(c0caf5)
$muted     = rgb(565f89)
$red       = rgb(f7768e)
$yellow    = rgb(e0af68)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOutQuint
    animation = fadeOut, 1, 6, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 4
    blur_size = 8
    brightness = 0.4
    vibrancy = 0.1
}

# Relógio
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 90
    font_family = $font_thin
    position = 0, 120
    halign = center
    valign = center
}

# Data em português (o sistema não tem o locale pt_BR)
label {
    monitor =
    text = cmd[update:60000] d=(domingo segunda terça quarta quinta sexta sábado); m=(janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro); echo "${d[$(date +%w)]}, $(date +%-d) de ${m[$(( $(date +%-m) - 1 ))]}"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1                        # invisível; só aparece em erro ou Caps Lock
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.05)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color = $red
    capslock_color = $yellow
    font_color = $text
    font_family = $font

    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true

    fade_on_empty = true
    placeholder_text =
    check_text =
    fail_text = $ATTEMPTS

    position = 0, -60
    halign = center
    valign = center
}

# Layout do teclado (br / us) — evita digitar a senha no layout errado
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}

# Bloqueio do pam_faillock e tempo restante (vazio quando não há bloqueio)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/faillock-status.sh
    color = $red
    font_size = 10
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}
