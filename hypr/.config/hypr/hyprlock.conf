# Tela de bloqueio — Tokyo Night (mesma paleta da waybar e das bordas do Hyprland)

$font      = JetBrainsMono Nerd Font
$wallpaper = ~/dotfiles/wallpapers/a_city_at_night_with_a_fence_and_buildings.jpg

$text      = rgb(c0caf5)
$subtext   = rgb(a9b1d6)
$muted     = rgb(565f89)
$blue      = rgb(7aa2f7)
$purple    = rgb(bb9af7)
$green     = rgb(9ece6a)
$red       = rgb(f7768e)
$yellow    = rgb(e0af68)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOutQuint
    animation = fadeOut, 1, 6, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.55                            # escurece para o texto se destacar
    vibrancy = 0.2
}

# Relógio: horas e minutos em cores diferentes
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H)</b><span foreground='##bb9af7'>:</span>$(date +%M)"
    color = $text
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 190
    halign = center
    valign = center
}

# Data em português (o sistema não tem o locale pt_BR)
label {
    monitor =
    text = cmd[update:60000] d=(Domingo Segunda Terça Quarta Quinta Sexta Sábado); m=(Janeiro Fevereiro Março Abril Maio Junho Julho Agosto Setembro Outubro Novembro Dezembro); echo "${d[$(date +%w)]}, $(date +%-d) de ${m[$(( $(date +%-m) - 1 ))]}"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# Saudação
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ $h -lt 12 ]; then s="Bom dia"; elif [ $h -lt 18 ]; then s="Boa tarde"; else s="Boa noite"; fi; echo "$s, <b>${USER^}</b>"
    color = $blue
    font_size = 14
    font_family = $font
    position = 0, -25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    rounding = -1                                # formato de pílula
    inner_color = rgba(26, 27, 38, 0.75)
    outer_color = $blue $purple 45deg
    check_color = $green $blue 45deg
    fail_color = $red $yellow 45deg
    capslock_color = $yellow
    font_color = $text
    font_family = $font

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">󰌾  Digite sua senha</span>
    check_text = <i>Verificando…</i>
    fail_text = <b>Senha incorreta</b> <span foreground="##565f89">($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 0, -95
    halign = center
    valign = center
}

# Rodapé esquerdo: layout do teclado
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $muted
    font_size = 12
    font_family = $font
    position = 30, 25
    halign = left
    valign = bottom
}

# Rodapé direito: bateria
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT0/capacity); s=$(cat /sys/class/power_supply/BAT0/status); i=(󰁺 󰁻 󰁼 󰁽 󰁾 󰁿 󰂀 󰂁 󰂂 󰁹 󰁹); [ "$s" = Charging ] && ic=󰂄 || ic=${i[$((c / 10))]}; echo "$ic  $c%"
    color = $muted
    font_size = 12
    font_family = $font
    position = -30, 25
    halign = right
    valign = bottom
}
