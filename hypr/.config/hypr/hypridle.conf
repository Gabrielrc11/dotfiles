general {
    lock_cmd = pidof hyprlock || hyprlock        # evita abrir vários hyprlock
    before_sleep_cmd = loginctl lock-session     # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on   # liga a tela ao acordar
}

listener {
    timeout = 150                                # 2,5 min: diminui o brilho
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                # 5 min: bloqueia
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                # 5,5 min: desliga a tela
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

listener {
    timeout = 1800                               # 30 min: suspende
    on-timeout = systemctl suspend
}